name: calendar_read
description: Free/busy lookup for the operator's calendar.
kind: read
backend:
  type: adapter
  name: gcal_freebusy
credential: gcal_readonly
args_schema:
  type: object
  additionalProperties: false
  properties:
    window_minutes:
      type: integer
      minimum: 1
      maximum: 240
limits:
  rate: 30/min
  timeout: 10s
  max_response_bytes: 65536
