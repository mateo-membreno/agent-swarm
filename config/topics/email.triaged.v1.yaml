name: email.triaged.v1
description: An email classified by category and urgency.
schema:
  $id: email.triaged.v1
  type: object
  additionalProperties: false
  required:
    - message_id
    - category
    - urgency
  properties:
    message_id:
      type: string
      pattern: ^[A-Za-z0-9_-]{1,64}$
    category:
      enum:
        - billing
        - personal
        - work
        - newsletter
        - other
    urgency:
      enum:
        - low
        - normal
        - high
    summary:
      type: string
      maxLength: 280
      x-free-text: true
retention: 7d
partitions: 1
key: message_id
