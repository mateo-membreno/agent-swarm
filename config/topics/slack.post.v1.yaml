name: slack.post.v1
description: A message for the Slack sink connector to post.
schema:
  $id: slack.post.v1
  type: object
  additionalProperties: false
  required:
  - channel
  - text
  properties:
    channel:
      enum:
      - '#alerts'
    text:
      type: string
      maxLength: 500
      x-free-text: true
retention: 7d
partitions: 1
