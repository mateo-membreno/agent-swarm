name: news.summary.v1
description: A one-sentence summary and a topic tag for a story.
schema:
  $id: news.summary.v1
  type: object
  additionalProperties: false
  required:
  - id
  - title
  - summary
  - tag
  properties:
    id:
      type: string
      pattern: ^[A-Za-z0-9_-]{1,64}$
    title:
      type: string
      maxLength: 300
      x-free-text: true
    url:
      type: string
      maxLength: 500
      x-free-text: true
    summary:
      type: string
      maxLength: 600
      x-free-text: true
    tag:
      type: string
      maxLength: 40
      x-free-text: true
retention: 7d
partitions: 2
key: id
