name: hn_source
description: Polls the Hacker News front page (public, no key) and publishes each new story.
type: http_poll
url: https://hn.algolia.com/api/v1/search?tags=front_page
topic: news.story.v1
interval: 10m
items_path: hits
id_field: objectID
map:
  id: objectID
  title: title
  url: url
  points: points
limit: 30
timeout: 10s
max_response_bytes: 1048576
