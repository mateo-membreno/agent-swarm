[project]
name = "agent-harness-config"
version = "0.1.0"
description = "Configuration store and local web UI for the agent harness (plan.md §21)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "pyyaml>=6",
  "jsonschema>=4.21",
  "httpx>=0.27",
  "confluent-kafka>=2.4",
  "docker>=7",
  "ruamel.yaml>=0.18",
]

[project.scripts]
harness = "controller.cli:main"
harness-config = "configui.__main__:main"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools.packages.find]
include = ["configui*", "harness_core*", "gateway*", "controller*"]

[tool.setuptools.package-data]
configui = ["schemas/*.json", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["docker: needs Docker and a running stack (`harness up`); skipped otherwise"]

[tool.ruff]
line-length = 140
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Header"]
