name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:   # lets you start it by hand from the Actions tab or `gh workflow run ci.yml`

# Least privilege: CI only reads the repo.
permissions:
  contents: read

# A newer push to the same ref cancels the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Tests (includes validation of the shipped config/; Docker tests skip here)
        run: pytest -q

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: JS syntax
        run: |
          node --check configui/static/app.js
          for f in topicname canvas-core canvas-edit canvas-panels; do node --check configui/static/$f.js; done

  smoke:
    name: Server boots
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e .
      - name: Start the app and probe it
        run: |
          python -m configui --port 8787 &
          pid=$!
          for i in $(seq 1 20); do
            curl -fsS http://127.0.0.1:8787/api/kinds >/dev/null && break
            sleep 0.5
          done
          curl -fsS http://127.0.0.1:8787/ | grep -q "Harness config"
          curl -fsS http://127.0.0.1:8787/api/source | grep -q hn_source
          # Foreign Host headers must be refused (DNS-rebinding guard).
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'Host: evil.example.com' http://127.0.0.1:8787/api/kinds)" = "400"
          kill $pid

  ui:
    name: UI behaviour (jsdom)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: pip install -e .
      - run: npm install --no-audit --no-fund
        working-directory: tests/ui
      - name: Drive the UI against a server on a scratch copy of config/
        run: |
          cp -r config "$RUNNER_TEMP/config"
          HARNESS_CONFIG_DIR="$RUNNER_TEMP/config" python -m configui --port 8787 &
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:8787/api/kinds >/dev/null && break; sleep 0.5; done
          node tests/ui/drive.mjs
      - name: Drive the canvas (its own scratch config and staged-changes folder)
        run: |
          cp -r config "$RUNNER_TEMP/config2" && mkdir -p "$RUNNER_TEMP/data2"
          HARNESS_CONFIG_DIR="$RUNNER_TEMP/config2" HARNESS_DATA_DIR="$RUNNER_TEMP/data2" python -m configui --port 8788 &
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:8788/api/kinds >/dev/null && break; sleep 0.5; done
          BASE_URL=http://127.0.0.1:8788/ node tests/ui/canvas.mjs

  # The real thing: Redpanda, the gateway, hardened sandboxes, hostile-agent isolation tests and the
  # news-summary chain end to end. A stub LLM stands in for a model, so no API key is needed.
  docker:
    name: Sandboxes + end-to-end (Docker)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - name: Start the stack
        run: harness up --stub
      - name: Isolation and end-to-end tests
        run: pytest tests/docker -v
      - name: Show container logs on failure
        if: failure()
        run: docker compose --profile stub logs --tail=200 || true
      - name: Stop
        if: always()
        run: harness down
